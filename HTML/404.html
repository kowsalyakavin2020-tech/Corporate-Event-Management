<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — This page is not connected | Stackly</title>
  <meta name="description" content="404 — this room was moved, cancelled or never booked. Go back to the last section or return home." />
  <link rel="icon" href="../images/logo-icon.webp" type="image/webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../CSS/404.css" />
</head>
<body>

  <main class="nf-stage" id="nfStage">

    <p class="nf-eyebrow" id="nfEyebrow">
      <i class="fa-solid fa-eye nf-eye" aria-hidden="true"></i>
      the switchboard can't reach this room
    </p>

    <div class="nf-center" id="nfCenter">

      <div class="nf-glow" id="nfGlow" aria-hidden="true"></div>

      <div class="nf-lottie" id="nfLottie" aria-hidden="true"></div>

      <h1 class="nf-num" id="nfNum" role="text" aria-label="404">
        <span class="nf-digit">4</span><span class="nf-digit nf-digit-gold">0</span><span class="nf-digit">4</span>
      </h1>

    </div>

    <p class="nf-copy" id="nfCopy">
      This page is not connected to the stack. The room you were heading to may have
      moved to a new number &mdash; or it never got booked.
    </p>

    <div class="nf-actions" id="nfActions">
      <button type="button" class="btn btn-gold stripes-btn btn-magnetic" id="nfBack" data-magnetic>
        <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
        <span class="btn-label">Go Back</span>
      </button>
      <a href="../index.html" class="btn btn-ghost btn-conic btn-magnetic" id="nfHome" data-magnetic>
        <i class="fa-solid fa-house-chimney" aria-hidden="true"></i>
        <span class="btn-label">Back to Home</span>
      </a>
    </div>

    

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="../JS/404.js"></script>
</body>
</html>
